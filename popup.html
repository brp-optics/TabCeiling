<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Ceiling</title>
<style>
  :root {
    --paper:  #ffffff;
    --raised: #f4f3f7;
    --ink:    #14131a;
    --muted:  #6b6878;
    --line:   #dedbe6;
    --signal: #3f3d8a;
    --over:   #a2412f;
    --tap:    48px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #16151c;
      --raised: #22212b;
      --ink:    #edebf2;
      --muted:  #918da3;
      --line:   #32303d;
      --signal: #8b87e8;
      --over:   #e0705b;
    }
  }

  * { box-sizing: border-box; }

  /* The UA stylesheet's [hidden] { display: none } loses to any author rule
     that sets display — .row sets display:flex, so the hidden attribute would
     otherwise do nothing on those elements. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-width: 288px;
    padding: 18px 16px 14px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Roboto", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- The gauge: how much of the budget is spent ---- */

  .gauge { text-align: center; margin-bottom: 18px; }

  .count {
    font-family: ui-monospace, "Roboto Mono", "DejaVu Sans Mono", monospace;
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .count .slash { color: var(--muted); margin: 0 2px; }
  .count .limit { color: var(--muted); }
  .count.is-over #used { color: var(--over); }
  .count.is-off .slash, .count.is-off .limit { display: none; }

  .pips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    margin: 14px 0 10px;
  }
  .pips:empty { margin: 10px 0 0; }
  .pip {
    width: 20px;
    height: 6px;
    border-radius: 3px;
    background: transparent;
    border: 1px solid var(--line);
  }
  .pip.filled { background: var(--signal); border-color: var(--signal); }
  .pip.over   { background: var(--over);   border-color: var(--over); }

  .status { margin: 0; font-size: 13px; color: var(--muted); }
  .status.is-over { color: var(--over); }

  /* ---- Controls ---- */

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }

  /* Whichever control ends up first has no content above it to separate from. */
  .row:first-of-type { border-top: 0; padding-top: 0; }

  .block {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }

  .label { display: block; font-size: 15px; }
  .hint  { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--raised);
    border-radius: 10px;
    overflow: hidden;
    flex: none;
  }
  .stepper button {
    width: var(--tap);
    height: var(--tap);
    border: 0;
    background: none;
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .stepper button:disabled { color: var(--muted); opacity: 0.4; cursor: default; }
  .stepper .value {
    width: 68px;
    min-width: 0;
    height: var(--tap);
    border: 0;
    background: none;
    color: var(--ink);
    text-align: center;
    font-family: ui-monospace, "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    -moz-appearance: textfield;
  }

  /* ---- Segmented control ---- */

  .seg {
    display: flex;
    margin-top: 10px;
    background: var(--raised);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1;
    min-height: 42px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 2px;
  }
  .seg button[aria-checked="true"] {
    background: var(--signal);
    color: #fff;
    font-weight: 500;
  }

  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .foot {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .alert {
    display: none;
    margin: 0 0 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--over);
    color: var(--over);
    font-size: 13px;
    line-height: 1.35;
  }
  .alert.show { display: block; }

  /* Shown but clearly not in force. Kept legible rather than greyed to
     unreadability, since the number is still editable. */
  .is-inactive { opacity: 0.5; }

  .linkish {
    background: none;
    border: 0;
    padding: 4px;
    color: var(--signal);
    font: inherit;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* Deliberately plain and at the bottom: an escape hatch should be reachable,
     not inviting. */
  .wide {
    width: 100%;
    min-height: var(--tap);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: none;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .wide:active { background: var(--raised); }
</style>
</head>
<body>

  <p class="alert" id="alert" role="status"></p>

  <div class="row" id="blockRow" hidden>
    <span>
      <span class="label">Block new tabs</span>
      <span class="hint">Tabs you open are closed. Tabs Firefox restores are left alone.</span>
    </span>
    <input type="checkbox" id="blockNew">
  </div>

  <div class="gauge" id="gauge">
    <div class="count" id="count">
      <span id="used">–</span><span class="slash">/</span><span class="limit" id="limitReadout">–</span>
    </div>
    <div class="pips" id="pips"></div>
    <p class="status" id="status">Counting tabs…</p>
  </div>

  <div class="row" id="ceilingToggleRow">
    <span>
      <span class="label">Block new tabs at ceiling</span>
      <span class="hint">Tabs you open are closed once you are over the ceiling.</span>
    </span>
    <input type="checkbox" id="ceilingOn">
  </div>

  <div class="row" id="ceilingRow">
    <span class="label">Tab ceiling</span>
    <div class="stepper">
      <button id="minus" type="button" aria-label="Lower the ceiling">−</button>
      <input class="value" id="limitValue" type="number" inputmode="numeric"
             min="1" max="9999" aria-label="Tab ceiling">
      <button id="plus" type="button" aria-label="Raise the ceiling">+</button>
    </div>
  </div>

  <div class="block">
    <span class="label">Load links in the current tab</span>
    <div class="seg" id="seg" role="radiogroup" aria-label="Load links in the current tab">
      <button type="button" role="radio" data-mode="never" aria-checked="false">Never</button>
      <button type="button" role="radio" data-mode="ceiling" aria-checked="false">At ceiling</button>
      <button type="button" role="radio" data-mode="always" aria-checked="false">Always</button>
    </div>
    <p class="hint" id="modeHint"></p>
  </div>

  <div class="block">
    <button class="wide" id="grantBtn" type="button">Allow one new tab</button>
    <p class="hint" id="grantHint"></p>
  </div>

  <p class="foot" id="activity"></p>
  <p class="foot">Changes apply immediately.</p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
