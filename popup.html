<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Ceiling</title>
<style>
  :root {
    --paper:  #ffffff;
    --raised: #f4f3f7;
    --ink:    #14131a;
    --muted:  #6b6878;
    --line:   #dedbe6;
    --signal: #3f3d8a;
    --over:   #a2412f;
    --tap:    48px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #16151c;
      --raised: #22212b;
      --ink:    #edebf2;
      --muted:  #918da3;
      --line:   #32303d;
      --signal: #8b87e8;
      --over:   #e0705b;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-width: 288px;
    padding: 18px 16px 14px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Roboto", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- The gauge: how much of the budget is spent ---- */

  .gauge { text-align: center; margin-bottom: 20px; }

  .count {
    font-family: ui-monospace, "Roboto Mono", "DejaVu Sans Mono", monospace;
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .count .slash { color: var(--muted); margin: 0 2px; }
  .count .limit { color: var(--muted); }
  .count.is-over #used { color: var(--over); }

  .pips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    margin: 14px 0 10px;
  }
  .pip {
    width: 20px;
    height: 6px;
    border-radius: 3px;
    background: transparent;
    border: 1px solid var(--line);
  }
  .pip.filled { background: var(--signal); border-color: var(--signal); }
  .pip.over   { background: var(--over);   border-color: var(--over); }

  .status { margin: 0; font-size: 13px; color: var(--muted); }
  .status.is-over { color: var(--over); }

  /* ---- Controls ---- */

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }

  .label { display: block; font-size: 15px; }
  .hint  { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--raised);
    border-radius: 10px;
    overflow: hidden;
    flex: none;
  }
  .stepper button {
    width: var(--tap);
    height: var(--tap);
    border: 0;
    background: none;
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  .stepper button:disabled { color: var(--muted); opacity: 0.4; cursor: default; }
  .stepper .value {
    min-width: 32px;
    text-align: center;
    font-family: ui-monospace, "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }

  input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex: none;
    accent-color: var(--signal);
    margin: 0;
  }

  label.row { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .foot {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="gauge">
    <div class="count" id="count">
      <span id="used">–</span><span class="slash">/</span><span class="limit" id="limitReadout">–</span>
    </div>
    <div class="pips" id="pips"></div>
    <p class="status" id="status">Counting tabs…</p>
  </div>

  <div class="row">
    <span class="label">Tab ceiling</span>
    <div class="stepper">
      <button id="minus" type="button" aria-label="Lower the ceiling">−</button>
      <span class="value" id="limitValue">–</span>
      <button id="plus" type="button" aria-label="Raise the ceiling">+</button>
    </div>
  </div>

  <label class="row">
    <span>
      <span class="label">Open blocked links in their origin tab</span>
      <span class="hint">At the ceiling, a link that would open a new tab loads in the current tab instead of being dropped.</span>
    </span>
    <input type="checkbox" id="redirect">
  </label>

  <p class="foot">Changes apply immediately.</p>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
